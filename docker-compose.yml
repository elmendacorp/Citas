services:
  web:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    environment:
      - "PORT=80"
      - "WHATSAPP_"
      - "WHATSAPP_PHONE_ID=1167405676452853"
      - "WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
