services:
  web:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    environment:
      - "PORT=80"
      - "WHATSAPP_TOKEN=${WHATSAPP_TOKEN}"
      - "WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}"
      - "WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
